[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "words-telegram-stats"
version = "1.0.0"
description = "Advanced linguistic analysis, psychology patterns, and interactive dashboard for Telegram chats"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Yaroslav Lazarenko" }
]
dependencies = [
    "telethon>=1.36.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "qrcode>=7.4.2",
    "pillow>=10.0.0",
    "python-dateutil>=2.9.0",
    "pymorphy3>=2.0.2",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "pymorphy3-dicts-uk>=2.4.1.1.1663094765",
    "wordfreq>=3.1.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "wordcloud>=1.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
